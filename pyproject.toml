[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minora-hermes-adapter"
version = "0.1.0"
description = "Hermes runtime adapter for Minora Control Plane"
requires-python = ">=3.11"
authors = [{name = "Minora AI"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
runtime = ["minora-control-plane>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
